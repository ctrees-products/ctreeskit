[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctreeskit"
version = "0.2.0"
description = """
CTrees toolkit for geospatial analysis and forest carbon monitoring.
Core features include xarray-based analysis tools.
"""
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["xarray", "geospatial", "zonal-statistics", "carbon", "biomass"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
authors = [
    { name = "Naomi Provost", email = "nprovost@ctrees.org" },
]


# Core runtime deps -- kept lightweight and pip-installable (no GDAL). arraylake 1.x
# requires icechunk>=2.0.6 + zarr>=3.1.0 + Python>=3.12, so those floors are pinned
# together; loosening any one of them reintroduces the old-icechunk incompatibility.
dependencies = [
    "xarray>=2025.7.1",
    "rioxarray>=0.17.0",
    "rasterio>=1.4.3",
    "numpy>=2.0",
    "pandas>=2.2.2",
    "shapely>=2.0.6",
    "pyproj>=3.6.1",
    "s3fs>=2025.3.0",
    "dask>=2025.5.1",
    "arraylake>=1.1.1",
    "icechunk>=2.0.6",
    "zarr>=3.1.0",
    "flox>=0.11.2",
]

[project.optional-dependencies]
# Coverage-fraction rasterization for geometry-weighted zonal stats, via
# rasterix (dask-aware wrappers around exactextract). Fully pip-installable.
# ``sparse`` backs rasterix's exactextract path through numba; numba>=0.63
# supports Python 3.14 but caps numpy below 2.5, so installs with this extra
# resolve numpy to a 2.4.x release.
zonal = [
    "rasterix>=0.2.2",
    "exactextract>=0.3.0",
    "geopandas>=1.0",
    "sparse>=0.15",
    "numba>=0.63",
]

# Dev tooling lives in a PEP 735 dependency group (installed with `uv sync --dev`,
# never shipped in the wheel).
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.5.1",
]

[tool.ruff]
line-length = 100

[project.urls]
Homepage = "https://github.com/ctrees-products/ctreeskit"
Repository = "https://github.com/ctrees-products/ctreeskit.git"
Documentation = "https://github.com/ctrees-products/ctreeskit#readme"
"Bug Tracker" = "https://github.com/ctrees-products/ctreeskit/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]  # Add this to ensure tests can import package

[tool.hatch.build.targets.wheel]
packages = ["src/ctreeskit"]

[tool.hatch.build.targets.sdist]
include = ["src/ctreeskit", "README.md", "LICENSE"]
