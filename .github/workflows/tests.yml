# .github/workflows/tests.yml
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.27"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Core + interactive + dev only. The `zonal` extra is intentionally excluded:
      # it needs a system GDAL that isn't pip-installable on the runner.
      - name: Install the project
        run: uv sync --locked --extra interactive --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest tests/
